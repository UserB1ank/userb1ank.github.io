<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Station</title>
  <link rel="stylesheet" href="/css/win11.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #windows-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 500;
      pointer-events: none;
    }
    #windows-container .window {
      pointer-events: auto;
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.02;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 1) 0px,
        rgba(0, 0, 0, 1) 1px,
        transparent 1px,
        transparent 2px
      );
    }
  </style>
</head>
<body>
  <div class="desktop" id="desktop">
    <div class="desktop-icon" data-folder="about" ondblclick="openFolder('about')">
      <div class="icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="4" y="12" width="32" height="24" rx="2" fill="#FFC107"/>
          <rect x="4" y="8" width="14" height="6" rx="1" fill="#FFD54F"/>
        </svg>
      </div>
      <div class="label">About Me</div>
    </div>
    <div class="desktop-icon" data-folder="posts" ondblclick="openFolder('posts')">
      <div class="icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="4" y="12" width="32" height="24" rx="2" fill="#FFC107"/>
          <rect x="4" y="8" width="14" height="6" rx="1" fill="#FFD54F"/>
        </svg>
      </div>
      <div class="label">Posts</div>
    </div>
    <div class="desktop-icon" data-folder="category" ondblclick="openFolder('category')">
      <div class="icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="4" y="12" width="32" height="24" rx="2" fill="#FFC107"/>
          <rect x="4" y="8" width="14" height="6" rx="1" fill="#FFD54F"/>
        </svg>
      </div>
      <div class="label">Category</div>
    </div>
  </div>

  <div class="taskbar">
    <div class="taskbar-center">
      <button class="start-button" onclick="showStartMenu()" title="Start">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="8" height="8" rx="1" fill="#0078d4" stroke="none"/>
          <rect x="13" y="3" width="8" height="8" rx="1" fill="#ffb900" stroke="none"/>
          <rect x="3" y="13" width="8" height="8" rx="1" fill="#e74856" stroke="none"/>
          <rect x="13" y="13" width="8" height="8" rx="1" fill="#00b7c3" stroke="none"/>
        </svg>
      </button>
      <div class="taskbar-windows" id="taskbar-windows"></div>
    </div>
    <div class="system-tray">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 16l8-8 8 8"/>
        <circle cx="12" cy="6" r="2" fill="currentColor"/>
      </svg>
      <span id="clock"></span>
    </div>
  </div>

  <div id="windows-container"></div>
  <div class="scanlines"></div>

  <script src="/js/markdown-renderer.js"></script>
  <script src="/js/window-manager.js"></script>
  <script src="/js/file-browser.js"></script>
  <script src="/js/desktop.js"></script>
</body>
</html>
