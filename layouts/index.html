<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Station</title>
  <link rel="stylesheet" href="/css/intro.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0a2e 0%, #0f0f23 100%);
    }
    canvas {
      display: block;
    }
    /* 蒸汽波网格背景 */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(transparent 0%, rgba(255, 0, 255, 0.03) 50%, transparent 100%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 50px,
          rgba(255, 0, 255, 0.1) 50px,
          rgba(255, 0, 255, 0.1) 51px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 50px,
          rgba(0, 255, 255, 0.1) 50px,
          rgba(0, 255, 255, 0.1) 51px
        );
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <canvas id="scene"></canvas>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    function initScene() {
      const canvas = document.getElementById('scene');
      if (!canvas) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

      renderer.setSize(window.innerWidth, window.innerHeight);

      scene.background = new THREE.Color(0x0a0a1a);
      scene.fog = new THREE.Fog(0x0a0a1a, 5, 25);

      // 创建复古 LCD 显示器
      const monitor = createMonitor();
      scene.add(monitor);

      // 蒸汽波网格
      const gridHelper = createGrid();
      scene.add(gridHelper);

      // 光源
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const cyanLight = new THREE.PointLight(0x00ffff, 1.5, 50);
      cyanLight.position.set(5, 5, 5);
      scene.add(cyanLight);

      const pinkLight = new THREE.PointLight(0xff00ff, 0.8, 50);
      pinkLight.position.set(-5, -2, 3);
      scene.add(pinkLight);

      // 相机动画
      const startPos = new THREE.Vector3(-8, 0, 5);
      const endPos = new THREE.Vector3(0, 0, 3);
      camera.position.copy(startPos);
      camera.lookAt(0, 0, 0);

      const duration = 2500;
      const fadeStart = 2000;
      const startTime = Date.now();

      function animate() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const easeProgress = progress < 0.5
          ? 2 * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        camera.position.x = startPos.x + (endPos.x - startPos.x) * easeProgress;
        camera.position.y = startPos.y + (endPos.y - startPos.y) * easeProgress;
        camera.position.z = startPos.z + (endPos.z - startPos.z) * easeProgress;
        camera.lookAt(0, 0, 0);

        if (elapsed > fadeStart) {
          const fadeProgress = (elapsed - fadeStart) / (duration - fadeStart);
          renderer.domElement.style.opacity = 1 - fadeProgress;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          setTimeout(() => {
            window.location.href = '/desktop/';
          }, 300);
        }

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function createMonitor() {
      const group = new THREE.Group();

      // 外壳
      const shellMat = new THREE.MeshPhongMaterial({ color: 0x888888 });
      const shellMain = new THREE.Mesh(new THREE.BoxGeometry(4.2, 3.2, 0.4), shellMat);
      group.add(shellMain);

      // 屏幕边框
      const bezelMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
      const bezel = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.9, 0.1), bezelMat);
      bezel.position.z = 0.2;
      group.add(bezel);

      // 屏幕
      const screenMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 2.6), screenMat);
      screen.position.z = 0.26;
      group.add(screen);

      // XP 风格发光
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        transparent: true,
        opacity: 0.3
      });
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1), glowMat);
      glow.position.z = 0.27;
      group.add(glow);

      // 支架
      const standMat = new THREE.MeshPhongMaterial({ color: 0x666666 });
      const stand = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 1), standMat);
      stand.position.y = -1.85;
      stand.position.z = -0.1;
      group.add(stand);

      const neck = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.25), standMat);
      neck.position.y = -1.5;
      neck.position.z = 0.1;
      group.add(neck);

      return group;
    }

    function createGrid() {
      const gridGroup = new THREE.Group();
      const gridMat = new THREE.LineBasicMaterial({
        color: 0xff00ff,
        transparent: true,
        opacity: 0.25
      });

      for (let i = -10; i <= 0; i++) {
        const points = [
          new THREE.Vector3(-15, i, -10),
          new THREE.Vector3(15, i, -10)
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        gridGroup.add(new THREE.Line(geometry, gridMat));
      }

      for (let i = -15; i <= 15; i += 2) {
        const points = [
          new THREE.Vector3(i, -10, -10),
          new THREE.Vector3(i * 0.3, 0, -5)
        ];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        gridGroup.add(new THREE.Line(geometry, gridMat));
      }

      return gridGroup;
    }

    initScene();
  </script>
</body>
</html>
