<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Station</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* Boot Screen */
    #boot-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }
    #boot-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* Windows 11 Logo - Fluent Design */
    .windows-logo {
      width: 100px;
      height: 100px;
      margin-bottom: 40px;
      opacity: 0;
      transform: scale(0.9);
      animation: logoReveal 0.6s ease-out 0.3s forwards;
    }
    @keyframes logoReveal {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .windows-logo svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 40px rgba(0, 120, 212, 0.3));
    }
    /* Loading dots */
    .loading-dots {
      display: flex;
      gap: 8px;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 0.6s forwards;
    }
    .loading-dots span {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Progress bar - subtle */
    .progress-container {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 30px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 0.5s forwards;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0078d4, #60cdff);
      border-radius: 2px;
      animation: win11Progress 3s ease-out 0.8s forwards;
    }
    @keyframes win11Progress {
      0% { width: 0%; }
      30% { width: 35%; }
      60% { width: 65%; }
      85% { width: 88%; }
      100% { width: 100%; }
    }
    /* Scanlines */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.03) 0px,
        rgba(0, 0, 0, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 20001;
    }
  </style>
</head>
<body>
  <div id="boot-screen">
    <div class="windows-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Windows 11 logo - 4 colored panes -->
        <!-- Top-left: Blue -->
        <rect x="10" y="10" width="38" height="38" rx="4" fill="#0078d4"/>
        <!-- Top-right: Red -->
        <rect x="52" y="10" width="38" height="38" rx="4" fill="#f25022"/>
        <!-- Bottom-left: Green -->
        <rect x="10" y="52" width="38" height="38" rx="4" fill="#7fba00"/>
        <!-- Bottom-right: Yellow -->
        <rect x="52" y="52" width="38" height="38" rx="4" fill="#ffb900"/>
      </svg>
    </div>
    <div class="loading-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="progress-container">
      <div class="progress-fill"></div>
    </div>
  </div>
  <div class="scanlines"></div>

  <script>
    setTimeout(() => {
      document.getElementById('boot-screen').classList.add('hidden');
      setTimeout(() => {
        window.location.href = '/desktop.html';
      }, 400);
    }, 3800);
  </script>
</body>
</html>
